<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="title desc"><title id="title">Displayed reaction step</title><desc id="desc">A propanone-derived cyanohydrin alkoxide with its negative charge and lone pair adjacent to oxygen, beside H–O–H. The alkoxide carbon is bonded to two methyl groups, nitrile carbon and oxygen. Completed arrows and species after this step: (CH₃)₂C(OH)–C≡N + OH⁻</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17212b}line{stroke:#17212b;stroke-width:2.5}circle{fill:#17212b}.curly{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style><text x="170" y="194" text-anchor="middle" style="font-size:30px">C</text><text x="85" y="194" text-anchor="middle" style="font-size:30px">CH<tspan baseline-shift="sub" font-size="18px">3</tspan></text><line x1="120" y1="184" x2="148" y2="184"/><text x="170" y="282" text-anchor="middle" style="font-size:30px">CH<tspan baseline-shift="sub" font-size="18px">3</tspan></text><line x1="170" y1="206" x2="170" y2="245"/><text x="170" y="95" text-anchor="middle" style="font-size:30px">C</text><text x="235" y="95" text-anchor="middle" style="font-size:30px">N</text><line x1="189" y1="78" x2="214" y2="78"/><line x1="189" y1="85" x2="214" y2="85"/><line x1="189" y1="92" x2="214" y2="92"/><line x1="170" y1="109" x2="170" y2="160"/><line x1="192" y1="184" x2="268" y2="184"/><text x="290" y="194" text-anchor="middle" style="font-size:30px">O</text><circle cx="320" cy="179" r="2.7"/><circle cx="320" cy="189" r="2.7"/><text x="311" y="168" text-anchor="middle" style="font-size:20px">−</text><text x="420" y="194" text-anchor="middle" style="font-size:30px">H</text><text x="500" y="194" text-anchor="middle" style="font-size:30px">O</text><text x="565" y="194" text-anchor="middle" style="font-size:30px">H</text><line x1="440" y1="184" x2="478" y2="184"/><line x1="522" y1="184" x2="546" y2="184"/><path class="curly" d="M311,158 Q365.5,83 420,184"/><path class="curly" d="M459,184 Q479.5,109 500,184"/><line x1="30" y1="330" x2="570" y2="330"/><text x="300" y="375" text-anchor="middle" style="font-size:22px">Species after this step</text><text x="300" y="425" text-anchor="middle" style="font-size:30px">(CH<tspan baseline-shift="sub" font-size="18px">3</tspan>)<tspan baseline-shift="sub" font-size="18px">2</tspan>C(OH)–C≡N + OH<tspan baseline-shift="super" font-size="20px">−</tspan></text></svg>