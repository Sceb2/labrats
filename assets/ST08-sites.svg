<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Reaction step</title><desc id="desc">Br⁻ with a lone pair beside CH₃–CH₂⁺, with the positive charge on the end carbon.</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker></defs><style>text{font:24px Arial,sans-serif;fill:#17212b}line,path.bond{stroke:#17212b;stroke-width:2.5;fill:none}.small{font-size:18px}.curly{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style><text x="100" y="194" text-anchor="middle" class="">Br</text><text x="100" y="105" text-anchor="middle" class="">−</text><text x="100" y="142" text-anchor="middle" class="">••</text><text x="300" y="194" text-anchor="middle" class="">CH<tspan baseline-shift="sub" font-size="16px">3</tspan></text><line x1="333" y1="184" x2="429" y2="184"/><text x="465" y="194" text-anchor="middle" class="">CH<tspan baseline-shift="sub" font-size="16px">2</tspan></text><text x="480" y="111" text-anchor="middle" class="">+</text></svg>