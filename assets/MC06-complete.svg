<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="title desc"><title id="title">Displayed reaction step</title><desc id="desc">Bromide with an adjacent lone pair and formal negative charge, beside an ethyl carbocation. The positively charged carbon has three single bonds. Completed arrows and species after this step: CH₃CH₂Br</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17212b}line{stroke:#17212b;stroke-width:2.5}circle{fill:#17212b}.curly{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style><text x="100" y="194" text-anchor="middle" style="font-size:30px">Br</text><circle cx="65" cy="179" r="2.7"/><circle cx="65" cy="189" r="2.7"/><text x="124" y="168" text-anchor="middle" style="font-size:20px">−</text><text x="355" y="194" text-anchor="middle" style="font-size:30px">CH<tspan baseline-shift="sub" font-size="18px">3</tspan></text><line x1="393" y1="184" x2="443" y2="184"/><text x="465" y="194" text-anchor="middle" style="font-size:30px">C</text><text x="490" y="165" text-anchor="middle" style="font-size:20px">+</text><line x1="465" y1="161" x2="465" y2="118"/><text x="465" y="106" text-anchor="middle" style="font-size:30px">H</text><line x1="465" y1="206" x2="465" y2="250"/><text x="465" y="280" text-anchor="middle" style="font-size:30px">H</text><path class="curly" d="M65,184 Q265.0,109 465,184"/><line x1="30" y1="330" x2="570" y2="330"/><text x="300" y="375" text-anchor="middle" style="font-size:22px">Species after this step</text><text x="300" y="425" text-anchor="middle" style="font-size:30px">CH<tspan baseline-shift="sub" font-size="18px">3</tspan>CH<tspan baseline-shift="sub" font-size="18px">2</tspan>Br</text></svg>