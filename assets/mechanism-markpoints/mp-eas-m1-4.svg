<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-labelledby="title"><title id="title">Electrophile generation equation followed by the claim that AlCl₃ is consumed without regeneration.</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14563e"/></marker></defs><rect width="600" height="350" rx="12" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#17212b"><text x="300" y="130" font-size="26" text-anchor="middle" >Cl₂ + AlCl₃ → Cl⁺ + AlCl₄⁻</text><text x="300" y="210" font-size="23" text-anchor="middle" >AlCl₃ is consumed; no regeneration</text></g></svg>
