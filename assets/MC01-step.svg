<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Displayed reaction step</title><desc id="desc">Hydroxide O–H, with one assessed lone pair adjacent to O and a formal negative charge, beside CH₃–CH₂–Br. Carbon and halogen have adjacent δ+ and δ− labels.</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17212b}line{stroke:#17212b;stroke-width:2.5}circle{fill:#17212b}.curly{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style><text x="65" y="194" text-anchor="middle" style="font-size:30px">O</text><line x1="84" y1="184" x2="113" y2="184"/><text x="130" y="194" text-anchor="middle" style="font-size:30px">H</text><circle cx="37" cy="179" r="2.7"/><circle cx="37" cy="189" r="2.7"/><text x="86" y="169" text-anchor="middle" style="font-size:20px">−</text><text x="215" y="194" text-anchor="middle" style="font-size:30px">CH<tspan baseline-shift="sub" font-size="18px">3</tspan></text><line x1="253" y1="184" x2="299" y2="184"/><text x="320" y="194" text-anchor="middle" style="font-size:30px">C</text><line x1="320" y1="162" x2="320" y2="115"/><text x="320" y="105" text-anchor="middle" style="font-size:30px">H</text><line x1="320" y1="206" x2="320" y2="248"/><text x="320" y="278" text-anchor="middle" style="font-size:30px">H</text><line x1="341" y1="184" x2="476" y2="184"/><text x="500" y="194" text-anchor="middle" style="font-size:30px">Br</text><text x="347" y="166" text-anchor="middle" style="font-size:18px">δ+</text><text x="528" y="166" text-anchor="middle" style="font-size:18px">δ−</text></svg>