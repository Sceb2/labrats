<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Protonation after butan-2-one reduction</title><desc id="desc">The green start marker identifies lone pair on the organic intermediate oxygen. The organic ion is CH₃–CH(O⁻)–CH₂–CH₃, the intermediate after butan-2-one reduction. Its oxygen has a shown lone pair and negative charge. Water is H(left)–O–H(upper). A grey arrow from the left O–H bond returns that bond pair to the water oxygen. Complete the same arrow pair; the already drawn bond-breaking arrow fixes which water hydrogen is transferred. The missing arrow has been completed.</desc><defs><marker id="given-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#667783"/></marker><marker id="answer-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14563e"/></marker></defs><style>text{font-family:Arial,sans-serif}line{stroke:#17212b;stroke-width:2.4;stroke-linecap:round}circle{fill:#17212b}.supplied{stroke:#667783;stroke-width:2.7;fill:none;marker-end:url(#given-head)}.answer{stroke:#14563e;stroke-width:3;fill:none;marker-end:url(#answer-head)}</style><rect width="600" height="360" fill="white"/><text x="320" y="198" text-anchor="middle" font-size="27" fill="#17212b">C</text><text x="320" y="108" text-anchor="middle" font-size="27" fill="#17212b">O</text><text x="341" y="80" text-anchor="middle" font-size="20" fill="#17212b">−</text><line x1="320" y1="122" x2="320" y2="164"/><circle cx="346" cy="96" r="2.3"/><circle cx="346" cy="104" r="2.3"/><text x="222" y="252" text-anchor="middle" font-size="25" fill="#17212b">CH₃</text><text x="420" y="252" text-anchor="middle" font-size="25" fill="#17212b">CH₂</text><text x="518" y="282" text-anchor="middle" font-size="25" fill="#17212b">CH₃</text><text x="390" y="170" text-anchor="middle" font-size="24" fill="#17212b">H</text><line x1="300" y1="201" x2="250" y2="229"/><line x1="339" y1="201" x2="392" y2="229"/><line x1="451" y1="249" x2="489" y2="268"/><line x1="338" y1="178" x2="373" y2="165"/><text x="520" y="103" text-anchor="middle" font-size="27" fill="#17212b">O</text><text x="449" y="103" text-anchor="middle" font-size="24" fill="#17212b">H</text><text x="560" y="45" text-anchor="middle" font-size="24" fill="#17212b">H</text><line x1="466" y1="95" x2="503" y2="95"/><line x1="533" y1="77" x2="550" y2="51"/><text x="465" y="73" text-anchor="middle" font-size="16" fill="#17212b">δ+</text><text x="541" y="119" text-anchor="middle" font-size="16" fill="#17212b">δ−</text><path d="M483 95 Q488 145 510 107" class="supplied"/><circle cx="346" cy="100" r="11" style="fill:none;stroke:#14563e;stroke-width:2"/><path d="M346 100 Q390 25 437 89" class="answer"/></svg>