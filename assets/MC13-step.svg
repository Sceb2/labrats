<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Benzene nitration: missing attack arrow</title><desc id="desc">Benzene is drawn as a hexagonal ring with an inner delocalisation circle; unshown ring hydrogens are implicit. The green start marker identifies marked electron pair in the ring π system. The separate ion is linear O=N⁺=O. A grey arrow already goes from its lower N=O bond to that oxygen. The green marker gives the missing arrow’s source; choose its destination.</desc><defs><marker id="given-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#667783"/></marker><marker id="answer-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14563e"/></marker></defs><style>text{font-family:Arial,sans-serif}line{stroke:#17212b;stroke-width:2.4;stroke-linecap:round}circle{fill:#17212b}.supplied{stroke:#667783;stroke-width:2.7;fill:none;marker-end:url(#given-head)}.answer{stroke:#14563e;stroke-width:3;fill:none;marker-end:url(#answer-head)}</style><rect width="600" height="360" fill="white"/><line x1="170" y1="100" x2="239.28" y2="140.0"/><line x1="239.28" y1="140.0" x2="239.28" y2="220.0"/><line x1="239.28" y1="220.0" x2="170" y2="260"/><line x1="170" y1="260" x2="100.72" y2="220.0"/><line x1="100.72" y1="220.0" x2="100.72" y2="140.0"/><line x1="100.72" y1="140.0" x2="170" y2="100"/><circle cx="170" cy="180" r="48" style="fill:none;stroke:#17212b;stroke-width:2.2"/><text x="440" y="178" text-anchor="middle" font-size="27" fill="#17212b">N</text><text x="458" y="155" text-anchor="middle" font-size="18" fill="#17212b">+</text><text x="395" y="98" text-anchor="middle" font-size="27" fill="#17212b">O</text><text x="485" y="258" text-anchor="middle" font-size="27" fill="#17212b">O</text><line x1="424.9" y1="151.7" x2="402.9" y2="110.7"/><line x1="431.1" y1="148.3" x2="409.1" y2="107.3"/><line x1="455.1" y1="188.3" x2="477.1" y2="229.3"/><line x1="448.9" y1="191.7" x2="470.9" y2="232.7"/><path d="M463 210 Q525 200 489 236" class="supplied"/><circle cx="208" cy="151" r="11" style="fill:none;stroke:#14563e;stroke-width:2"/></svg>