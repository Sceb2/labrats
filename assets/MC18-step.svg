<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Nitrobenzene nitration: which nitrogen?</title><desc id="desc">Nitrobenzene has a ring bonded to N⁺(=O)–O⁻; this existing nitro group is separate from the incoming O=N⁺=O ion. Ring hydrogens are implicit. The question fixes the electron source and does not assess directing positions. The separate ion is linear O=N⁺=O. A grey arrow already goes from its lower N=O bond to that oxygen. The green start marker identifies marked electron pair in the ring π system. The green marker gives the missing arrow’s source; choose its destination.</desc><defs><marker id="given-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#667783"/></marker><marker id="answer-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14563e"/></marker></defs><style>text{font-family:Arial,sans-serif}line{stroke:#17212b;stroke-width:2.4;stroke-linecap:round}circle{fill:#17212b}.supplied{stroke:#667783;stroke-width:2.7;fill:none;marker-end:url(#given-head)}.answer{stroke:#14563e;stroke-width:3;fill:none;marker-end:url(#answer-head)}</style><rect width="600" height="360" fill="white"/><line x1="145" y1="108" x2="207.352" y2="144.0"/><line x1="207.352" y1="144.0" x2="207.352" y2="216.0"/><line x1="207.352" y1="216.0" x2="145" y2="252"/><line x1="145" y1="252" x2="82.648" y2="216.0"/><line x1="82.648" y1="216.0" x2="82.648" y2="144.0"/><line x1="82.648" y1="144.0" x2="145" y2="108"/><circle cx="145" cy="180" r="48" style="fill:none;stroke:#17212b;stroke-width:2.2"/><line x1="207" y1="144" x2="276" y2="144"/><text x="293" y="152" text-anchor="middle" font-size="25" fill="#17212b">N</text><text x="309" y="127" text-anchor="middle" font-size="18" fill="#17212b">+</text><text x="331" y="91" text-anchor="middle" font-size="25" fill="#17212b">O</text><text x="343" y="201" text-anchor="middle" font-size="25" fill="#17212b">O</text><text x="363" y="179" text-anchor="middle" font-size="18" fill="#17212b">−</text><line x1="300.2" y1="123.9" x2="317.2" y2="100.9"/><line x1="305.8" y1="128.1" x2="322.8" y2="105.1"/><line x1="305" y1="161" x2="333" y2="184"/><text x="470" y="178" text-anchor="middle" font-size="27" fill="#17212b">N</text><text x="488" y="155" text-anchor="middle" font-size="18" fill="#17212b">+</text><text x="425" y="98" text-anchor="middle" font-size="27" fill="#17212b">O</text><text x="515" y="258" text-anchor="middle" font-size="27" fill="#17212b">O</text><line x1="454.9" y1="151.7" x2="432.9" y2="110.7"/><line x1="461.1" y1="148.3" x2="439.1" y2="107.3"/><line x1="485.1" y1="188.3" x2="507.1" y2="229.3"/><line x1="478.9" y1="191.7" x2="500.9" y2="232.7"/><path d="M493 210 Q555 200 519 236" class="supplied"/><circle cx="108" cy="150" r="11" style="fill:none;stroke:#14563e;stroke-width:2"/></svg>