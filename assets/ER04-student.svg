<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Reaction step</title><desc id="desc">An alkene CH₂=CHCH₃ beside H–Cl; H is δ+ and Cl is δ−.</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker></defs><style>text{font:24px Arial,sans-serif;fill:#17212b}line,path.bond{stroke:#17212b;stroke-width:2.5;fill:none}.small{font-size:18px}.curly{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style><text x="110" y="194" text-anchor="middle" class="">CH<tspan baseline-shift="sub" font-size="16px">2</tspan></text><line x1="140" y1="177" x2="267" y2="177"/><line x1="140" y1="191" x2="267" y2="191"/><text x="295" y="194" text-anchor="middle" class="">CHCH<tspan baseline-shift="sub" font-size="16px">3</tspan></text><text x="405" y="194" text-anchor="middle" class="">H</text><text x="405" y="112" text-anchor="middle" class="">δ+</text><line x1="425" y1="184" x2="518" y2="184"/><text x="550" y="194" text-anchor="middle" class="">Cl</text><text x="550" y="112" text-anchor="middle" class="">δ−</text><path class="curly" d="M405,184 Q305.0,92 205,177"/><text x="300" y="305" text-anchor="middle" class="small">Student’s attempted step</text></svg>