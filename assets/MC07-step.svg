<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Displayed reaction step</title><desc id="desc">Hydride beside ethanal. The formal negative charge is beside the nucleophile; carbonyl δ+ and δ− labels are adjacent to C and O.</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17212b}line{stroke:#17212b;stroke-width:2.5}circle{fill:#17212b}.curly{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style><text x="315" y="200" text-anchor="middle" style="font-size:30px">C</text><text x="315" y="110" text-anchor="middle" style="font-size:30px">O</text><line x1="309" y1="121" x2="309" y2="167"/><line x1="321" y1="121" x2="321" y2="167"/><text x="343" y="183" text-anchor="middle" style="font-size:18px">δ+</text><text x="343" y="95" text-anchor="middle" style="font-size:18px">δ−</text><text x="225" y="235" text-anchor="middle" style="font-size:30px">CH<tspan baseline-shift="sub" font-size="18px">3</tspan></text><line x1="253" y1="213" x2="294" y2="198"/><text x="410" y="235" text-anchor="middle" style="font-size:30px">H</text><line x1="335" y1="198" x2="383" y2="214"/><text x="90" y="200" text-anchor="middle" style="font-size:30px">H</text><text x="112" y="174" text-anchor="middle" style="font-size:20px">−</text></svg>