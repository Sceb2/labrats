<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Bromination: remove the ring proton</title><desc id="desc">The upper-right ring carbon has two ring bonds, a bond to H and a bond to Br. The adjacent lower-right ring carbon bears +; two other ring double bonds are shown. A grey arrow from the upper-right C–H bond points into the adjacent ring bond. The green start marker identifies lone pair on the separate br⁻ ion. A separate Br⁻ ion is provided as the proton acceptor in this simplified final stage; its marked lone pair is shown. The green marker gives the missing arrow’s source; choose its destination.</desc><defs><marker id="given-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#667783"/></marker><marker id="answer-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14563e"/></marker></defs><style>text{font-family:Arial,sans-serif}line{stroke:#17212b;stroke-width:2.4;stroke-linecap:round}circle{fill:#17212b}.supplied{stroke:#667783;stroke-width:2.7;fill:none;marker-end:url(#given-head)}.answer{stroke:#14563e;stroke-width:3;fill:none;marker-end:url(#answer-head)}</style><rect width="600" height="360" fill="white"/><line x1="170" y1="100" x2="239.28" y2="140.0"/><line x1="239.28" y1="140.0" x2="239.28" y2="220.0"/><line x1="239.28" y1="220.0" x2="170" y2="260"/><line x1="170" y1="260" x2="100.72" y2="220.0"/><line x1="100.72" y1="220.0" x2="100.72" y2="140.0"/><line x1="100.72" y1="140.0" x2="170" y2="100"/><line x1="170.0" y1="245.6" x2="113.19039999999998" y2="212.79999999999998"/><line x1="113.19039999999998" y1="147.2" x2="170.0" y2="114.4"/><line x1="247.28" y1="135.0" x2="300" y2="100"/><line x1="249.28" y1="147.0" x2="293" y2="174"/><text x="305" y="189" text-anchor="middle" font-size="24" fill="#17212b">H</text><text x="257" y="221" text-anchor="middle" font-size="24" fill="#17212b">+</text><text x="320" y="104" text-anchor="middle" font-size="27" fill="#17212b">Br</text><text x="470" y="188" text-anchor="middle" font-size="30" fill="#17212b">Br</text><text x="501" y="157" text-anchor="middle" font-size="22" fill="#17212b">−</text><circle cx="438" cy="176" r="2.3"/><circle cx="438" cy="184" r="2.3"/><path d="M271 161 Q293 205 241 179" class="supplied"/><circle cx="438" cy="180" r="11" style="fill:none;stroke:#14563e;stroke-width:2"/></svg>