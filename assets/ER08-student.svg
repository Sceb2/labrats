<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Reaction step</title><desc id="desc">The student labels the intermediate oxygen O, although it has one single bond and no H.</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker></defs><style>text{font:24px Arial,sans-serif;fill:#17212b}line,path.bond{stroke:#17212b;stroke-width:2.5;fill:none}.small{font-size:18px}.curly{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style><text x="300" y="110" text-anchor="middle" class="">(CH<tspan baseline-shift="sub" font-size="16px">3</tspan>)<tspan baseline-shift="sub" font-size="16px">2</tspan>C(C≡N)–O</text><text x="300" y="195" text-anchor="middle" class="small">O has one single bond; no H is attached</text></svg>