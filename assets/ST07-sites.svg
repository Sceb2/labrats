<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Displayed reaction step</title><desc id="desc">Propene beside H–Cl. The H and halogen carry adjacent δ+ and δ− labels. Both bonds of C=C are visible. Additional explicitly labelled sites are offered for comparison where required.</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17212b}line{stroke:#17212b;stroke-width:2.5}circle{fill:#17212b}.curly{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style><text x="150" y="194" text-anchor="middle" style="font-size:30px">C</text><text x="285" y="194" text-anchor="middle" style="font-size:30px">C</text><line x1="172" y1="178" x2="263" y2="178"/><line x1="172" y1="190" x2="263" y2="190"/><text x="80" y="138" text-anchor="middle" style="font-size:30px">H</text><line x1="96" y1="142" x2="133" y2="172"/><text x="80" y="250" text-anchor="middle" style="font-size:30px">H</text><line x1="96" y1="226" x2="133" y2="196"/><text x="350" y="138" text-anchor="middle" style="font-size:30px">H</text><line x1="333" y1="142" x2="303" y2="172"/><text x="355" y="250" text-anchor="middle" style="font-size:30px">CH<tspan baseline-shift="sub" font-size="18px">3</tspan></text><line x1="335" y1="225" x2="303" y2="196"/><text x="420" y="194" text-anchor="middle" style="font-size:30px">H</text><line x1="442" y1="184" x2="520" y2="184"/><text x="545" y="194" text-anchor="middle" style="font-size:30px">Cl</text><text x="443" y="164" text-anchor="middle" style="font-size:18px">δ+</text><text x="565" y="164" text-anchor="middle" style="font-size:18px">δ−</text></svg>