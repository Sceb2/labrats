<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Butan-2-one reduction: missing attack arrow</title><desc id="desc">H⁻ is shown separately. Butan-2-one is CH₃–C(=O)–CH₂–CH₃. The carbonyl carbon has δ+ and its oxygen has δ−. Black atom and bond labels remain visible. The green start marker identifies negative charge on the separate h⁻ ion. A grey arrow from the C=O π bond to its oxygen is already drawn. Complete the other arrow in this same addition step. The green marker gives the missing arrow’s source; choose its destination.</desc><defs><marker id="given-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#667783"/></marker><marker id="answer-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14563e"/></marker></defs><style>text{font-family:Arial,sans-serif}line{stroke:#17212b;stroke-width:2.4;stroke-linecap:round}circle{fill:#17212b}.supplied{stroke:#667783;stroke-width:2.7;fill:none;marker-end:url(#given-head)}.answer{stroke:#14563e;stroke-width:3;fill:none;marker-end:url(#answer-head)}</style><rect width="600" height="360" fill="white"/><text x="330" y="198" text-anchor="middle" font-size="28" fill="#17212b">C</text><text x="330" y="103" text-anchor="middle" font-size="28" fill="#17212b">O</text><line x1="326" y1="117" x2="326" y2="165"/><line x1="334" y1="117" x2="334" y2="165"/><text x="354" y="178" text-anchor="middle" font-size="17" fill="#17212b">δ+</text><text x="354" y="89" text-anchor="middle" font-size="17" fill="#17212b">δ−</text><text x="235" y="247" text-anchor="middle" font-size="25" fill="#17212b">CH₃</text><text x="425" y="247" text-anchor="middle" font-size="25" fill="#17212b">CH₂</text><line x1="310" y1="200" x2="263" y2="224"/><line x1="350" y1="200" x2="397" y2="224"/><text x="520" y="247" text-anchor="middle" font-size="25" fill="#17212b">CH₃</text><line x1="457" y1="238" x2="485" y2="238"/><text x="65" y="153" text-anchor="middle" font-size="28" fill="#17212b">H</text><text x="89" y="127" text-anchor="middle" font-size="20" fill="#17212b">−</text><path d="M334 139 Q402 132 337 108" class="supplied"/><circle cx="89" cy="121" r="11" style="fill:none;stroke:#14563e;stroke-width:2"/></svg>