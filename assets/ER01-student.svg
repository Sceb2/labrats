<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Reaction step</title><desc id="desc">Hydroxide O–H with a negative charge and oxygen lone pair, beside CH₃–CH₂–Br; the carbon attached to Br is δ+ and Br is δ−.</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker></defs><style>text{font:24px Arial,sans-serif;fill:#17212b}line,path.bond{stroke:#17212b;stroke-width:2.5;fill:none}.small{font-size:18px}.curly{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style><text x="90" y="194" text-anchor="middle" class="">O</text><line x1="108" y1="184" x2="142" y2="184"/><text x="155" y="194" text-anchor="middle" class="">H</text><text x="75" y="105" text-anchor="middle" class="">−</text><text x="90" y="142" text-anchor="middle" class="">••</text><text x="215" y="193" text-anchor="middle" class="">CH<tspan baseline-shift="sub" font-size="16px">3</tspan></text><line x1="253" y1="184" x2="297" y2="184"/><text x="320" y="193" text-anchor="middle" class="">CH<tspan baseline-shift="sub" font-size="16px">2</tspan></text><text x="320" y="112" text-anchor="middle" class="">δ+</text><line x1="348" y1="184" x2="467" y2="184"/><text x="500" y="193" text-anchor="middle" class="">Br</text><text x="500" y="112" text-anchor="middle" class="">δ−</text><path class="curly" d="M320,184 Q205.0,51 90,136"/><text x="300" y="305" text-anchor="middle" class="small">Student’s attempted step</text></svg>