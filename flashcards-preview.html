/* LabRats design layer: shared by both subjects, accounts and standalone previews. */
:root{--paper:#f7f8f5;--ink:#172d3a;--muted:#52635b;--accent:#14563e;--rule:#d5dfd8;--finish:#8c3655;--feedback-method:#405c7c}
body{background:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif}h1{font-weight:400}.page-heading h1,.setup-page .page-heading h1{font-weight:400}
/* A: the subject selector uses the same paper, type, scale and rhythm as practice. */
body.subject-hub{background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.hub-main{max-width:1000px;padding:36px 24px}.hub-brand{color:var(--ink);font-size:1.15rem;font-weight:750;letter-spacing:normal;margin:0 0 30px}
.hub-main h1{font:400 clamp(2rem,5vw,3.1rem)/1.2 Georgia,serif;letter-spacing:-.02em}
.subject-grid{display:block;margin:30px 0 0;border-top:1px solid var(--rule)}
.subject-card{display:flex;align-items:center;gap:18px;min-height:105px;padding:20px 4px;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;box-shadow:none;transition:background .15s}
.subject-card:hover{transform:none;box-shadow:none;background:#edf6ef}.subject-card img{width:64px;height:64px;object-fit:contain;flex:none}
.subject-card h2{font:400 1.4rem/1.3 Georgia,serif;letter-spacing:normal;margin:0}.hub-links{margin-top:30px;gap:24px}
/* B: selectable topic rows; green denotes selection in either subject. */
.setup-page .module-section .checks,.setup-page .wave-topic-list{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--rule)}
.setup-page .module-section label.topic,.setup-page .lesson-row{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:12px;text-align:left;min-height:60px;margin:0;padding:12px;border:0;border-bottom:1px solid var(--rule);border-left:3px solid transparent;border-radius:0;box-shadow:none;background:transparent;transition:background .15s}
.setup-page .module-section label.topic:hover,.setup-page .lesson-row:hover{background:#f0f4f0}
.setup-page .module-section label.topic:has(input:checked),.setup-page .lesson-row:has(input:checked),.setup-page .lesson-row:has(input:indeterminate){background:#edf6ef;border-left-color:var(--accent);box-shadow:none}
.setup-page .module-section label.topic input,.setup-page .lesson-row>input{position:static;flex:none;width:21px;height:21px;margin:0;accent-color:var(--accent)}
.setup-page .module-section .topic-text,.setup-page .lesson-row .topic-name{font:400 1.15rem/1.35 Georgia,serif;text-align:left;text-wrap:initial;flex:1;min-width:0;width:auto}
.setup-page .lesson-row>span{flex:1;min-width:0;width:auto}.topic-meta{font:400 .85rem/1.4 system-ui,sans-serif;color:var(--muted);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.setup-page .setup-actions{border:0;border-radius:0;background:transparent;padding:0;margin:24px 0;box-shadow:none}.setup-actions p{margin-bottom:12px}.setup-actions .btn{border-radius:7px}
/* C: score first, then mark-level evidence and a specific correction. */
.answer-review,.feedback-panel{border:0;border-top:2px solid var(--accent);border-radius:0;background:transparent;box-shadow:none;padding:20px 0 0;margin:0}
.feedback-heading{display:block;margin:0 0 20px;padding:0;background:transparent;border:0}.feedback-heading h2,.question-screen .feedback-heading h2{font:400 1.8rem/1.2 Georgia,serif;margin:0 0 8px;letter-spacing:-.02em}
.feedback-heading p,.question-screen .feedback-heading p{font:400 .94rem/1.5 system-ui,sans-serif;color:var(--muted);margin:0}
.feedback-point.mark-row,.question-screen .feedback-point.mark-row{display:block;padding:16px 0;margin:0;border:0;border-top:1px solid var(--rule);background:transparent;border-radius:0;box-shadow:none}
.point-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.point-heading h3{min-width:0;font:650 .95rem/1.5 system-ui,sans-serif;margin:0}.point-heading h3>span{margin-right:4px}
.point-marks{flex:none;white-space:nowrap;font-size:.85rem;line-height:1.5;font-variant-numeric:tabular-nums;color:var(--ink)}
.feedback-point.right h3{color:var(--accent)}.feedback-point.wrong h3{color:#795c17}.feedback-point.method h3{color:var(--feedback-method)}
.point-body{margin:8px 0 0;font-size:.95rem;line-height:1.55;overflow-wrap:anywhere}.point-body p{margin:8px 0 0}.point-body .your-answer{color:var(--muted);margin-bottom:8px}.point-body .correction{margin-top:8px}.point-body .chem{margin:8px 0}

.feedback-question[open]{padding-bottom:16px}.feedback-question .task-instructions{margin-top:16px}.feedback-question #task{margin-bottom:0}
.feedback-points,.feedback-help,.marking-detail{margin:20px 0 0}.feedback-points>summary,.feedback-help>summary{font-size:.94rem;font-weight:650;min-height:48px;padding:12px 0}
.feedback-explanation{font-size:.95rem;margin:16px 0}.feedback-panel .next-action,.question-screen .answer-actions:has(#retry){display:flex;gap:12px;align-items:stretch;background:transparent;border:0;padding:20px 0 0;margin:0}
.feedback-panel .next-action>.btn,.question-screen .answer-actions:has(#retry)>.btn{min-height:48px;border-radius:7px;font-size:.95rem;padding:12px 16px;white-space:normal;flex:1;width:auto}
