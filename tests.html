<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Software validation · OCR organic</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand">Software validation</div><nav><a href="index.html">Student practice</a><a href="teacher.html">Teacher preview</a></nav></header><main><div class="card"><h1>Automated software checks</h1><p>These verify data consistency and deterministic marking. They do not prove chemistry accuracy, correct diagrams, specification appropriateness, lack of ambiguity or good distractors.</p><p id="summary" role="status">Running…</p><ul id="results"></ul></div></main><script src="core.js"></script><script src="ui.js"></script><script src="tests/suite.js"></script><script>
U.load().then(async bank=>{const results=ChemTests(bank);const checks=await Promise.all(Object.entries(bank.assets).map(async([id,a])=>{try{return {name:'Asset loads: '+id,pass:(await fetch(a.path)).ok}}catch{return {name:'Asset loads: '+id,pass:false}}}));results.push(...checks);document.querySelector('#summary').textContent=`${results.filter(r=>r.pass).length}/${results.length} software checks passed. ${bank.questions.filter(q=>q.status!=='teacher-approved').length} questions still require teacher chemistry review.`;document.querySelector('#results').innerHTML=results.map(r=>`<li class="${r.pass?'pass':'fail'}">${r.pass?'PASS':'FAIL'} — ${U.esc(r.name)} ${U.esc(r.error||'')}</li>`).join('');}).catch(e=>document.querySelector('#summary').textContent='FAIL — '+e.message);
</script></body></html>
