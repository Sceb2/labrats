<!doctype html><meta charset="utf-8"><title>Automated checks</title><body><h1>Automated data checks</h1><pre id="out">Running…</pre><script>fetch('questions.json').then(r=>r.json()).then(d=>{let e=[],ids=new Set,types={};for(const q of d.questions){if(ids.has(q.id))e.push('duplicate '+q.id);ids.add(q.id);types[q.type]=(types[q.type]||0)+1;if(!q.prerequisites.length)e.push(q.id+' no prereqs');if(!q.specRefs.length)e.push(q.id+' no spec');if(!q.options.length)e.push(q.id+' no options');for(const a of q.answers)if(!q.options[a])e.push(q.id+' bad answer index')}for(const t of ['reagents','multistep','mechanism-id','mechanism-completion','sites','nomenclature'])if(types[t]!==6)e.push(t+' count '+types[t]);let alias=d.vocabulary.reagents['dichromate-acid'].aliases;if(!alias.includes('acidified potassium dichromate(VI)')||!alias.includes('K₂Cr₂O₇/H⁺'))e.push('dichromate aliases missing');out.textContent=e.length?'FAIL
'+e.join('
'):'PASS
36 unique questions; 6 per type; prerequisites/spec refs/options/answers present; dichromate aliases verified.'}).catch(e=>out.textContent='FAIL '+e)</script></body>
